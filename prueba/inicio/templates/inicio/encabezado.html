<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
<title>{%block titulo%}{%endblock%}</title>

{%load static%}
<link href="{%static 'inicio/css/bootstrap.min.css'%}" rel="stylesheet" type="text/css">
<link href="{%static 'inicio/css/londinium-theme.css'%}" rel="stylesheet" type="text/css">
<link href="{%static  'inicio/css/styles.css'%}" rel="stylesheet" type="text/css">
<link href="{%static 'inicio/css/icons.css'%}" rel="stylesheet" type="text/css">
<link href="http://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700&amp;subset=latin,cyrillic-ext" rel="stylesheet" type="text/css">

<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.1/jquery.min.js"></script>
<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.10.2/jquery-ui.min.js"></script>

<script type="text/javascript" src="{% static 'inicio/js/plugins/charts/sparkline.min.js' %}"></script>

<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/uniform.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/select2.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/inputmask.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/autosize.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/inputlimit.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/listbox.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/multiselect.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/validate.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/tags.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/switch.min.js' %}"></script>

<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/uploader/plupload.full.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/uploader/plupload.queue.min.js' %}"></script>

<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/wysihtml5/wysihtml5.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/forms/wysihtml5/toolbar.js' %}"></script>

<script type="text/javascript" src="{% static 'inicio/js/plugins/interface/daterangepicker.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/interface/fancybox.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/interface/moment.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/interface/jgrowl.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/interface/datatables.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/interface/colorpicker.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/interface/fullcalendar.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/plugins/interface/timepicker.min.js' %}"></script>

<script type="text/javascript" src="{% static 'inicio/js/bootstrap.min.js' %}"></script>
<script type="text/javascript" src="{% static 'inicio/js/application.js' %}"></script>

<style>
	@media (max-width: 768px) {
		.sidebar {
			display: none;
			width: 100% !important;
			position: static !important;
		}
		.mobile-navbar {
			display: block !important;
		}
		table {
		    display: block;
		    overflow-x: auto;
		    white-space: nowrap;
		}
		.show-mobile-sidebar {
			display: block !important;
		}
	}
</style>
<script>
	$(document).ready(function(){
		$('#mobile-menu-btn').on('click', function(e){
			e.preventDefault();
			$('#main-sidebar').toggleClass('show-mobile-sidebar');
		});
	});
</script>
</head>

<body>

	

 	<div class="page-container">

		<!-- Custom Navbar for Mobile -->
		<div class="mobile-navbar" style="display:none; background:#333; color:#fff; padding:10px; text-align:right;">
			<span style="float:left; font-size:18px; line-height:30px; margin-left: 10px;">Menu</span>
			<button id="mobile-menu-btn" type="button" style="background:#555; color:#fff; border:none; padding:8px 15px; cursor:pointer; font-size: 16px; border-radius: 4px;">
				☰
			</button>
			<div style="clear:both;"></div>
		</div>

		<!-- Barra de menú -->
		<div class="sidebar" id="main-sidebar">

        <!--Imagen de Usuario-->

		<div class="user-menu dropdown">
			<a href="#">
				<img src="{%block imagen %}{%endblock%}">
				<div class="user-info">
			{% block proyecto %}  {% endblock %}<span>DSM</span>

					
				</div>
			</a>
		</div>			


			<div class="sidebar-content">
				<!-- Menú de navegación -->
				<ul class="navigation">
							<li><a href="{%url 'Principal'%}">Principal</a></li>
							<li><a href="{%url 'Formulario'%}">Registro</a></li>
                            <li><a href="{%url 'Contacto'%}">Contacto</a></li>
                            <li><a href="{%url 'Comentarios'%}">Comentarios</a></li>
				</ul>
				<!-- /Fin menú -->
			</div>
		</div>
		<!-- /sidebar -->

{%block contenido%}
{%endblock%}
	</div>
</body>
</html>
